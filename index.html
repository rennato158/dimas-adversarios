<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DIMAS Adversários</title>
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="DIMAS Adversários">
  <script src="tema.js"></script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icone.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icone-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Michroma&family=Open+Sans:wght@400;600;700&family=Saira+Condensed:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilo.css">
</head>
<body class="bloqueado">
  <div class="abertura" id="abertura" role="status" aria-label="Carregando DIMAS Adversários">
    <img class="abertura-logo" src="logo-dimas.png" alt="DIMAS — Departamento Integrado de Mercado e Análise Sistemática">
    <div class="abertura-titulo"><span>DIMAS</span><b>ADVERSÁRIOS</b><i></i></div>
    <p class="abertura-sub">Análise de adversários do Ceará Sporting Club</p>
    <div class="abertura-barra"><i id="abertura-progresso"></i></div>
    <p class="abertura-pct" id="abertura-pct">0%</p>
  </div>

  <div class="entrada" id="entrada" hidden>
    <form id="form-entrada" novalidate>
      <img class="abertura-logo" src="logo-dimas.png" alt="DIMAS">
      <div class="abertura-titulo pequeno"><span>DIMAS</span><b>ADVERSÁRIOS</b><i></i></div>
      <label for="entrada-email">E-mail</label>
      <input id="entrada-email" type="email" autocomplete="username" inputmode="email" autocapitalize="none" spellcheck="false" required>
      <label for="entrada-senha">Senha</label>
      <input id="entrada-senha" type="password" autocomplete="current-password" required>
      <p class="entrada-erro" id="entrada-erro" role="alert"></p>
      <button class="botao" type="submit" id="entrada-botao">Entrar</button>
      <p class="entrada-nota">Acesso restrito à comissão técnica. Peça seu acesso ao DIMAS.</p>
    </form>
  </div>

  <header class="topo">
    <a class="icone" id="voltar" href="#/" aria-label="Voltar" hidden>
      <svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
    </a>
    <a class="marca" href="#/" aria-label="Início">
      <b>DIMAS <span>ADVERSÁRIOS</span></b>
    </a>
    <button class="icone" id="abrir-busca" aria-label="Buscar atleta ou equipe">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    </button>
    <button class="icone" data-tema-alternar aria-label="Alternar tema claro ou escuro">
      <svg class="so-escuro" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.900 4.900l1.400 1.400M17.700 17.700l1.400 1.400M2 12h2M20 12h2M4.900 19.100l1.400-1.400M17.700 6.300l1.400-1.400"/></svg>
      <svg class="so-claro" viewBox="0 0 24 24"><path d="M20 14.500A8 8 0 0 1 9.500 4a8 8 0 1 0 10.500 10.500z"/></svg>
    </button>
    <button class="icone" id="sair" aria-label="Sair da conta" hidden>
      <svg viewBox="0 0 24 24"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 16l4-4-4-4M14 12H4"/></svg>
    </button>
    <button class="icone" id="atualizar" aria-label="Atualizar dados">
      <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.3-4.3L4 8.5M4 4v4.5h4.5M4 13a8 8 0 0 0 14.3 4.3L20 15.500M20 20v-4.500h-4.500"/></svg>
    </button>
  </header>

  <main id="tela"></main>

  <div class="camada" id="busca" role="dialog" aria-label="Busca">
    <header>
      <input id="campo-busca" type="search" placeholder="Buscar atleta ou equipe" autocomplete="off" enterkeyhint="search">
      <button class="icone" data-fechar aria-label="Fechar busca"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </header>
    <div class="resultados" id="resultados"></div>
  </div>

  <div class="camada" id="janela" role="dialog" aria-label="Material">
    <header>
      <b id="janela-titulo"></b>
      <a class="icone" id="janela-externo" target="_blank" rel="noopener" aria-label="Abrir fora do app"><svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg></a>
      <button class="icone" data-fechar aria-label="Fechar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </header>
    <iframe id="janela-quadro" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
  </div>

  <div id="aviso" role="status" aria-live="polite"></div>

  <script src="config.js"></script>
  <script src="nucleo.js"></script>
  <script src="app.js"></script>
</body>
</html>
